version: '3.8'

services:
  widebook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: widebook-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      # Add any other environment variables your app needs here
    networks:
      - coolify
    # Make sure the container keeps running
    restart: unless-stopped

# Utilisation du réseau externe "coolify" existant
networks:
  coolify:
    external: true
