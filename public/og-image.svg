<!-- Simple SVG for OG Image (base64 encoded to simulate an image file) -->
<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grad)" />
  <text x="600" y="300" font-family="Arial" font-size="60" text-anchor="middle" fill="white" font-weight="bold">Widebook</text>
  <text x="600" y="380" font-family="Arial" font-size="32" text-anchor="middle" fill="rgba(255,255,255,0.8)">Votre plateforme de blogs et de contenu</text>
</svg>
